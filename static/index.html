<style>

footer{background:linear-gradient(160deg,#050b1f,#1e3a8a);color:#e2e8f0;padding:20px 16px;margin:22px -14px -14px}.fh{font-size:11px;letter-spacing:1.5px;font-weight:800;margin:14px 0 10px;color:#93c5fd}
.fl{display:flex;gap:12px;align-items:center;background:#ffffff12;border:1px solid #ffffff22;border-radius:12px;padding:12px;margin-bottom:10px;color:#fff;text-decoration:none}
.dr{position:fixed;inset:0;background:#0008;z-index:30}.dr>div{position:absolute;right:0;top:0;bottom:0;width:78%;max-width:300px;background:#fff;padding:20px;overflow:auto}.dr a{display:block;padding:13px;border-radius:10px;font-weight:700;background:#f1f5f9;margin-bottom:8px}
.cm{position:fixed;inset:0;background:#0007;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}.cm>div{background:#fff;border-radius:8px;width:100%;max-width:420px;box-shadow:0 20px 50px #0006}.cm .cb{padding:20px 22px;line-height:1.6}.cm h3{margin:0 0 8px;color:#1e1b4b;font-size:21px}.cm p{margin:4px 0;font-size:16px}.cm .ct{border-top:1px solid #e5e7eb;padding:14px 22px;display:flex;gap:10px}.cm .ct button{box-shadow:none;border-radius:6px;font-size:16px;font-weight:600}.cm .b1{background:#2563eb}.cm .b2{background:#f00}

.nb{margin-top:10px;background:#fffbeb;border-left:4px solid #f59e0b;border-radius:8px;padding:10px 12px;font-size:12.5px;line-height:1.6;color:#92400e}.rw{margin-top:10px;background:#ecfdf5;border-left:4px solid #16a34a;border-radius:6px;padding:8px 12px;font-size:12.5px}
.cpb{padding:4px 10px;font-size:12px;border-radius:6px;box-shadow:none;background:#2563eb;margin-left:6px}.ul2{list-style:none;padding:0;margin:0}.ul2 li{padding:10px 0;border-bottom:1px solid #eef2f7;font-size:13.5px;line-height:1.7}.ul2 li:before{content:"●";color:#1d4ed8;font-size:9px;margin-right:8px}
.gp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chp{display:inline-flex;gap:6px;align-items:center;background:#eef2ff;border:1px solid #c7d2fe;border-radius:99px;padding:8px 12px;font-size:11.5px;color:#475569;letter-spacing:.3px}.chp b{color:#1d4ed8;font-size:14px}.chp.bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
</style></head><body><div id="app"></div><div id="inst"></div><nav id="nav"></nav><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);let U=null,C={},PG="",SEL=0,PKS=[],DR=0,tab="home",AS="stats",mt="list",DP=null,ROT=0;
async function api(p,b){const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});
const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Error");return j}
async function act(p,b,ok){try{await api(p,b||{});await load();if(ok)alert(ok)}catch(e){alert(e.message)}}
const val=k=>$("#f_"+k).value;
async function sub(ep,ks,ok){const b={};ks.split(",").forEach(k=>b[k]=val(k));await act(ep,b,ok||"Done")}
const F=(ep,fs,btn,ok)=>`<div class="card">${fs.map(f=>(f[3]!==undefined?`<div class="m" style="margin-top:8px">${esc(f[1])}</div>`:"")+`<input id="f_${f[0]}" placeholder="${f[1]}" ${f[2]?`type="${f[2]}"`:""} value="${esc(f[3]||"")}">`).join("")}<button class="w" onclick="sub('${ep}','${fs.map(f=>f[0])}','${ok||""}')">${btn}</button></div>`;
const M=n=>"৳"+(+n).toFixed(n%1?2:0);
const st={pending:"#f59e0b",approved:"#22c55e",done:"#22c55e",paid:"#22c55e",rejected:"#ef4444",cancelled:"#ef4444",open:"#22c55e"};
const LB={done:"Completed",pending:"In Progress",cancelled:"Cancelled",approved:"Completed",paid:"Paid",rejected:"Rejected"};
let DEPV={a:0,m:""};
function toast(m,bad){const t=document.createElement("div");t.className="tt"+(bad?" bad":"");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
function askModal(html,ok,fn){const d=document.createElement("div");d.className="cm";d.innerHTML=`<div><div class="cb">${html}</div><div class="ct"><button class="b1">${ok}</button><button class="b2">Cancel</button></div></div>`;document.body.appendChild(d);d.querySelector(".b2").onclick=()=>d.remove();d.querySelector(".b1").onclick=()=>{d.remove();fn()}}
const cp=t=>navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast("Copied")):0;
const tg=s=>`<span class="tag" style="color:${st[s]||"#0f172a"}">${esc(LB[s]||s)}</span>`;
const R=(t,s,x,b="")=>`<div class="card"><div class="row"><div>${t}<div class="m">${x}</div></div>${tg(s)}</div>${b?`<div class="row" style="margin-top:10px">${b}</div>`:""}</div>`;
async function load(){try{U=await api("me")}catch{U=null}draw()}
let AM="login",SE="",SD={};
function gbtn(){const g=$("#gb");if(!g)return;
if(!C.google){g.innerHTML='<span class="m">Google login ekhono chalu nai (Admin > Settings > google_client_id)</span>';return}
if(!(window.google&&google.accounts)){if(!window._gl){window._gl=1;const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=gbtn;
s.onerror=()=>{window._gl=0;g.innerHTML='<span class="m">Google script load hoy nai. Internet/adblock check korun</span>'};document.head.appendChild(s)}else setTimeout(gbtn,300);return}
google.accounts.id.initialize({client_id:C.google,callback:async r=>{try{U=await api("google",{credential:r.credential});draw()}catch(e){alert(e.message)}}});
g.innerHTML="";google.accounts.id.renderButton(g,{theme:"filled_black",size:"large",text:"continue_with",shape:"pill",width:Math.min(300,innerWidth-80)})}
function auth(){setTimeout(gbtn,50);const s=AM=="signup",v=AM=="verify";
const head=`<div class="logo" style="font-size:34px">${esc(C.site)}</div><p class="m">Game top-up · Tournament · Daily rewards</p>`;
if(v)return `<main style="padding-top:60px;text-align:center">${head}<div class="card" style="text-align:left"><div style="text-align:center;font-weight:800;font-size:16px;margin:2px 0 6px">Email verify korun</div>
<p class="m" style="text-align:center">6 digit code pathano hoyeche:<br><b class="gold">${esc(SE)}</b></p>
<input id="cd" inputmode="numeric" maxlength="6" placeholder="6 digit code" autocomplete="one-time-code" style="text-align:center;font-size:22px;letter-spacing:8px">
<button class="w" style="margin-top:8px" onclick="sVerify()">Verify & Create account</button>
<div class="m" style="text-align:center;margin-top:14px"><a style="color:#a855f7;font-weight:700" onclick="sResend()">Code abar pathan</a> · <a style="color:#a855f7;font-weight:700" onclick="AM='signup';draw()">Email change</a></div></div></main>`;
return `<main style="padding-top:60px;text-align:center">${head}
<div class="card" style="text-align:left"><div style="text-align:center;font-weight:800;font-size:16px;margin:2px 0 8px">${s?"Create account":"Welcome back"}</div>
<input id="u" placeholder="Username" autocomplete="username" value="${s?esc(SD.username||""):""}">${s?`<input id="e" type="email" placeholder="Email address" autocomplete="email" value="${esc(SD.email||"")}">`:""}<input id="p" type="password" placeholder="Password" autocomplete="${s?"new-password":"current-password"}">${s?'<input id="p2" type="password" placeholder="Confirm password" autocomplete="new-password">':""}
${s?`<button class="w" style="margin-top:8px" onclick="sStart()">Send verification code</button>`:`<div class="row" style="margin-top:8px"><button class="w" onclick="go('login')">Login</button><button class="w g" onclick="AM='signup';draw()">Sign up</button></div>`}
<div class="m" style="text-align:center;margin:14px 0 4px">— or —</div><div id="gb" style="margin-top:8px;display:flex;justify-content:center;text-align:center"></div>
${s?`<div class="m" style="text-align:center;margin-top:14px">Already account ache? <a style="color:#a855f7;font-weight:700" onclick="AM='login';draw()">Login</a></div>`:""}</div></main>`}
async function go(k){try{U=await api(k,{username:$("#u").value,password:$("#p").value});draw()}catch(e){alert(e.message)}}
async function sStart(){try{const d={username:$("#u").value,email:$("#e").value.trim(),password:$("#p").value};if($("#p2").value!==d.password)return alert("Password duita mile nai");
await api("signup/start",d);SD=d;SE=d.email.toLowerCase();AM="verify";draw()}catch(e){alert(e.message)}}
async function sVerify(){try{U=await api("signup/verify",{email:SE,code:$("#cd").value});AM="login";SD={};draw()}catch(e){alert(e.message)}}
async function sResend(){try{await api("signup/start",SD);alert("Notun code pathano hoyeche")}catch(e){alert(e.message)}}
const ic=n=>/diamond/i.test(n)?"💎":/member/i.test(n)?"🎫":/uc/i.test(n)?"🎯":/level/i.test(n)?"⭐":/vpn/i.test(n)?"🛡️":/gift|card/i.test(n)?"🎁":"🎮";
const foot=()=>`<footer><div class="fh">CUSTOMER SUPPORT</div><a class="fl" href="${esc(C.telegram)}" target="_blank"><span style="font-size:22px">✈</span><div><div style="font-size:11px;color:#cbd5e1">9AM – 11PM Daily</div><b>Telegram Support</b></div></a><a class="fl" href="${esc(C.telegram)}" target="_blank"><span style="font-size:22px">📢</span><div><div style="font-size:11px;color:#cbd5e1">Telegram Channel</div><b>Join Now</b></div></a><div class="fh">STAY CONNECTED</div><div class="fl"><b>${esc(C.site)}</b></div></footer>`;
function openP(n){PG=n;SEL=0;tab="prod";draw();scrollTo(0,0)}
async function home(){const [ps,lt,ct]=await Promise.all([api("packages"),api("latest"),api("cats")]),S={};
ps.forEach(p=>{const s=p.section||"TOPUP";((S[s]??={})[p.game]??=[]).push(p)});
const pop=!sessionStorage.pop?(sessionStorage.pop=1,`<div class="modal" onclick="this.remove()"><div class="card"><h2 style="margin-top:0">🎁 Offer</h2><p>${esc(C.popup)}</p><button onclick="tab='matches';draw()">Join Now</button></div></div>`):"";
return pop+`<div class="nt"><b>NOTICE</b><div style="overflow:hidden;flex:1"><span>${esc(C.notice)}</span></div></div>
<div class="hero" style="${C.banner_img?`background-image:linear-gradient(90deg,#0b1d4dcc,#0b1d4d55),url(${esc(encodeURI(C.banner_img))});background-size:cover;background-position:center`:""}"><h2>${esc(C.banner_title)}</h2><div style="opacity:.9;margin-bottom:12px">${esc(C.banner_text)}</div><button class="g" onclick="tab='matches';draw()">Join Now →</button></div>
<h3 class="sec">🎉 OFFERS 🎊</h3><div class="grid"><div class="tl" onclick="tab='matches';draw()"><i>🏆</i><b>FREE</b></div></div>`+
Object.entries(S).map(([s,g])=>`<h3 class="sec">${esc(s)}</h3><div class="grid">${Object.keys(g).map(n=>`<div class="tl" data-g="${esc(n)}" onclick="openP(this.dataset.g)"><i ${ct[n]?`class="im" style="background-image:url(${esc(encodeURI(ct[n]))})"`:""}>${ct[n]?"":ic(n+" "+g[n][0].name)}</i><b>${esc(n)}</b></div>`).join("")}</div>`).join("")+
`<h3 class="sec">LATEST ORDERS</h3>`+(lt.map(x=>`<div class="card row" style="padding:10px 14px"><div><b>${esc(x.username)}</b><div class="m">${esc(x.package)} · ${esc(x.created)}</div></div>${tg("done")}</div>`).join("")||'<p class="m" style="text-align:center">Ekhono kono order nai</p>')+foot()}
async function prod(){PKS=(await api("packages")).filter(p=>p.game==PG);const sp=PKS.find(p=>p.id==SEL),low=sp&&U.balance<sp.price;
return `<div class="card"><h3 style="margin-top:0" class="row"><span><span class="sn">1</span>Select Recharge</span>${sp&&C.coin_rate>0?`<span class="tag" style="background:#fef3c7;color:#92400e">🪙 +${Math.floor(sp.price*C.coin_rate/100)} coins</span>`:""}</h3><div class="g2">${PKS.map(p=>`<div class="op ${p.id==SEL?"on":""} ${p.stock==0?"off":""}" onclick="SEL=${p.id};draw()"><span>${ic(p.name)} ${esc(p.name)} ${p.stock==0?"<small>OUT OF STOCK</small>":""}</span><b>${M(p.price)}</b></div>`).join("")}</div>${low?`<p style="color:#dc2626;font-size:13px">⚠ You do not have enough money to order this package, Please <a style="color:#2563eb;font-weight:700" onclick="tab='wallet';draw()">Add Money</a> or choose another package.</p>`:""}</div>
<div class="card"><h3 style="margin-top:0"><span class="sn">2</span>Account Info</h3><div class="m">Player ID</div><input id="pid" inputmode="numeric" placeholder="Enter Player ID" value="${esc(localStorage.pid||"")}" oninput="localStorage.pid=this.value;$('#pc').innerHTML=pcHtml()"><div class="gp"><button id="chkb" onclick="chk()">Check Player ID</button><span id="pc" style="display:contents">${pcHtml()}</span></div></div>
<div class="card"><h3 style="margin-top:0"><span class="sn">3</span>Select Payment</h3><div class="pay"><div>${esc(C.site)}</div><b>WALLET PAY</b></div><div class="stat"><span>Your account balance:</span><b>${M(U.balance)}</b></div>${sp?`<div class="stat"><span>You need to purchase this product:</span><b>${M(sp.price)}</b></div>`:""}</div>
<div class="card row">${low?`<button class="g w" onclick="tab='wallet';draw()">Add Money</button>`:""}<button class="w" id="buybtn" ${sp&&!low?"":"disabled"} onclick="buy(${sp?sp.id:0})">Buy Now</button></div>
<div class="card"><h3 style="margin-top:0"><span class="sn">4</span>Rules &amp; Conditions</h3><div style="font-size:13px;line-height:1.7;white-space:pre-line">${esc(C.rules)}</div></div>`+foot()}
const okid=v=>/^\d{5,15}$/.test(v);
let PC={};
const pcHtml=()=>{if(PC.uid!=(localStorage.pid||""))return"";if(PC.none)return '<span class="chp bad">Player ID paoa jayni</span>';if(PC.err)return `<span class="chp bad">${esc(PC.err)}</span>`;return `<span class="chp">NAME <b>${esc(PC.name)}</b></span><span class="chp">LEVEL <b>${esc(PC.level??"-")}</b></span>`};
async function chk(){const v=$("#pid").value.trim();if(!okid(v))return alert("Player ID 5-15 digit hote hobe");if(!C.uidcheck)return alert("✅ Player ID format thik ache: "+v);
const b=$("#chkb"),o=b.innerHTML;b.disabled=1;b.innerHTML='<span class="sp"></span>';
try{const r=await api("player/"+v);PC=r.found?{uid:v,name:r.name,level:r.level}:{uid:v,none:1}}catch(e){PC={uid:v,err:e.message}}
b.disabled=0;b.innerHTML=o;$("#pc").innerHTML=pcHtml()}
function buy(id){const p=PKS.find(x=>x.id==id),v=$("#pid").value.trim();if(!p)return;if(!okid(v))return alert("Sothik Player ID din");
askModal(`<h3>Confirm Order</h3><p>Your current wallet is <b>${M(U.balance)}</b></p><p>You need <b>${M(p.price)}</b> to purchase this product.</p>${PC.uid==v&&PC.name?`<p>Player: <b>${esc(PC.name)}</b> (${esc(v)})</p>`:""}`,"Confirm order",()=>place(p.id,v))}
async function place(id,v){const b=$("#buybtn");if(b){b.disabled=1;b.innerHTML='<span class="sp"></span>'}
try{await api("order",{package_id:id,player_id:v});toast("Your order has been placed successfully.");tab="orders";await load();scrollTo(0,0)}catch(e){toast(e.message,1);draw()}}
async function orders(){const h=await api("history");return `<h3 class="sec" style="text-align:left">MY ORDERS</h3>`+(h.orders.map(o=>`<div class="card"><div class="row" style="align-items:flex-start"><div style="line-height:1.9;font-size:13.5px"><b>Order Id:</b> ${o.id}<br><b>Date:</b> ${esc(o.created)}<br><b>Total Price:</b> ${M(o.price)}<br><b>Player Id:</b> ${esc(o.player_id)}<br><b>Package Name:</b> ${esc(o.package)}</div>${tg(o.status)}</div>${o.status=="pending"?`<div class="nb"><b>NOTE</b><br>${esc(o.note||C.pending_note)}</div>`:""}${o.status=="done"&&o.reward>0?`<div class="rw">🪙 <b>Coin reward:</b> +${o.reward} coins</div>`:""}</div>`).join("")||'<p class="m" style="text-align:center">Kono order nai</p>')+foot()}
async function tx(){const h=await api("history");return `<h3 class="sec">My Transactions</h3><div class="card" style="overflow-x:auto"><table style="width:100%;font-size:12.5px;border-collapse:collapse"><tr class="m"><td>Amount</td><td>TrxID</td><td>Status</td><td>Date</td></tr>${h.deposits.map(d=>`<tr><td style="padding:8px 0"><b>${M(d.amount)}</b></td><td>${esc(d.trx)}</td><td>${tg(d.status)}</td><td>${esc(d.created)}</td></tr>`).join("")||'<tr><td class="m">Kichu nai</td></tr>'}</table></div>`+foot()}
async function matches(){const t=await api("tournaments");const L=mt=="list"?t.filter(x=>!x.mine||x.status=="open"):t.filter(x=>x.mine);
return `<div class="seg"><a class="${mt=="list"?"on":""}" onclick="mt='list';draw()">Match List</a><a class="${mt=="hist"?"on":""}" onclick="mt='hist';draw()">History</a></div>`+
(L.map(x=>{const full=x.joined>=x.slots;return `<div class="card"><div class="row"><b>${esc(x.title)}</b>${tg(x.status)}</div>
<div class="g2" style="margin-top:10px"><div class="stat">Prize<b>${M(x.prize)}</b></div><div class="stat">Type<b>${esc(x.mode)}</b></div><div class="stat">Entry<b>${M(x.entry)}</b></div><div class="stat">Per kill<b>${M(x.per_kill)}</b></div></div>
<div class="m" style="margin-top:8px">Min Level ${x.min_level} · Registration ${x.joined}/${x.slots}</div><div class="bar"><div style="width:${Math.min(100,x.joined/x.slots*100)}%"></div></div>
<div class="m" style="text-align:center">⏰ Starts in <b class="cd gold" data-t="${esc(x.start)}">--</b></div>
<div class="row" style="margin-top:10px">${x.mine?"<button class='w ok'>✔ Joined</button>":`<button class="w" ${full||x.status!="open"?"disabled":""} onclick="jn(${x.id},${x.entry})">${full?"Full":"Join Match"}</button>`}
<button class="g" onclick="alert('Rules:\\n1. Hack/cheat korle ban\\n2. Room ID/Password keu k dibena\\n3. Shuru hower 5 min age room e dhukun')">Rules</button>
<button class="g" onclick="alert(${x.mine?`'Room ID: ${esc(x.room_id)||"-"}\\nPassword: ${esc(x.room_pass)||"-"}'`:"'Age match join korun'"})">Room</button></div></div>`}).join("")||'<p class="m" style="text-align:center">Kono match nai</p>')}
function jn(id,e){const n=prompt("Apnar in-game name?");if(n&&confirm(`Entry fee ${M(e)} katbe. Join korben?`))act(`tournament/${id}/join`,{ign:n},"✅ Joined!")}
async function wallet(){const h=await api("history");
return `<div class="hero"><div style="opacity:.8;font-size:12px">Wallet Balance</div><h2 style="font-size:34px;margin:2px 0">${M(U.balance)}</h2><div>🪙 ${U.coins} coins</div></div>
<div class="card"><h3 style="margin-top:0"><span class="sn">1</span>Select Payment Method</h3><div class="pay" style="max-width:170px"><div style="font-size:15px">bKash · Nagad · Rocket</div><b>AUTO PAYMENT</b></div></div>
<div class="card"><h3 style="margin-top:0"><span class="sn">2</span>Add Money</h3><div class="m">Amount</div><input id="da" type="number" inputmode="numeric" placeholder="Amount (৳)"><button class="w" id="addb" onclick="${C.auto?"addm()":"goCo()"}">Add Money</button></div>`+foot()}
function goCo(){const a=+$("#da").value;if(!(a>=10))return alert("Minimum 10 taka din");DEPV={a,m:""};tab="checkout";draw();scrollTo(0,0)}
async function checkout(){const d=DEPV;if(!d.a){tab="wallet";return wallet()}
if(!d.m)return `<div class="card" style="text-align:center"><div class="logo" style="font-size:24px">${esc(C.site)}</div><span class="pill" style="display:inline-block;margin-top:8px">Pay ${d.a} BDT</span></div>
<div class="card"><div class="m" style="text-align:center;margin-bottom:10px">পেমেন্ট পদ্ধতি নির্বাচন করুন</div><div class="g2">${C.methods.map(m=>`<div class="tl" data-m="${esc(m.m)}" onclick="DEPV.m=this.dataset.m;draw();scrollTo(0,0)"><i style="font-size:16px;font-weight:900;color:#fff;padding:22px 4px">${esc(m.m)}</i><b>${esc(m.m)} Personal</b></div>`).join("")}</div><button class="g w" style="margin-top:12px" onclick="tab='wallet';draw()">← Back</button></div>`;
const n=(C.methods.find(x=>x.m==d.m)||{}).n||"",m=esc(d.m);
return `<div class="card" style="text-align:center"><div style="font-size:22px;font-weight:900;color:#e2136e">${m}</div></div><div class="card"><b>${esc(C.site)}</b></div><div class="card"><b style="font-size:20px">${d.a} BDT</b></div>
<div class="card"><ul class="ul2"><li>আপনার ${m} মোবাইল অ্যাপে যান।</li><li>Send Money-এ ক্লিক করুন।</li><li>প্রাপক নম্বর হিসেবে এই নম্বরটি লিখুন: <b>${esc(n)}</b> <button class="cpb" data-c="${esc(n)}" onclick="cp(this.dataset.c)">কপি করুন</button></li><li>টাকার পরিমাণ: <b>${d.a}</b> <button class="cpb" data-c="${d.a}" onclick="cp(this.dataset.c)">কপি করুন</button></li><li>নিশ্চিত করতে এখন আপনার ${m} পিন লিখুন।</li><li>এখন নিচের বক্সে আপনার Transaction ID দিন এবং Verify বাটনে ক্লিক করুন।</li></ul>
<div class="m" style="margin-top:12px;font-weight:700;color:#0f172a">Transaction ID</div><input id="dt" placeholder="ট্রানজেকশন আইডি লিখুন" style="text-transform:uppercase"></div>
<button class="w" id="vbtn" style="padding:14px;font-size:15px" onclick="verifyDep()">VERIFY</button><button class="g w" style="margin-top:10px" onclick="DEPV.m='';draw()">← Method change</button>`}
async function verifyDep(){const t=$("#dt").value.trim(),b=$("#vbtn");if(t.length<6)return alert("Sothik Transaction ID din");b.disabled=1;b.innerHTML='<span class="sp"></span>';
try{const r=await api("deposit",{method:DEPV.m,amount:DEPV.a,trx:t});toast(r.status=="approved"?"Payment verified! Balance add hoyeche.":"Transaction ID submit hoyeche. Verify hole balance add hobe.");DEPV={a:0,m:""};tab="tx";await load();scrollTo(0,0)}catch(e){toast(e.message,1);b.disabled=0;b.textContent="VERIFY"}}
async function addm(){const a=+$("#da").value;if(!(a>=10))return alert("Minimum 10 taka din");const b=$("#addb");b.disabled=1;b.innerHTML='<span class="sp"></span>';try{const r=await api("deposit/auto",{amount:a});location.href=r.url}catch(e){toast(e.message,1);b.disabled=0;b.textContent="Add Money"}}
async function spin(){const s=await api("spins"),W=C.wheel,col=["#ef4444","#f59e0b","#22c55e","#06b6d4","#6366f1","#a855f7","#ec4899","#f97316"];
const bg=W.map((_,i)=>`${col[i]} ${i*45}deg ${(i+1)*45}deg`).join(",");
return `<div class="card" style="text-align:center"><h3 style="margin-top:0">🎡 Daily Spin</h3><div class="ptr">▼</div><div id="wh" style="background:conic-gradient(${bg});transform:rotate(${ROT}deg)">${W.map((w,i)=>`<b style="transform:rotate(${i*45+22.5}deg) translateY(-98px)">${w}</b>`).join("")}</div>
<p class="m">Remaining today: ${U.can_spin?1:0} / 1 · 100 coin = ৳10</p><div class="row"><button class="w" ${U.can_spin?"":"disabled"} onclick="doSpin()">SPIN</button><button class="w g" onclick="act('redeem',{},'Coin balance e add hoyeche')">Redeem ${U.coins} 🪙</button></div></div>
<h3>Recent Winners</h3>`+s.map(x=>`<div class="card row"><span>🏅 ${esc(x.username)}</span><b class="gold">${x.coins} Coins</b><span class="m">${x.created}</span></div>`).join("")}
async function doSpin(){try{const r=await api("spin",{});ROT=360*6-(r.idx*45+22.5);$("#wh").style.transform=`rotate(${ROT}deg)`;setTimeout(async()=>{alert(`🎉 Apni ${r.won} coin jitechen!`);await load()},4700)}catch(e){alert(e.message)}}
async function me_(){return `<div class="card" style="text-align:center;background:var(--g);color:#fff"><div class="av">${esc(U.username[0].toUpperCase())}</div><b style="font-size:18px">${esc(U.username)}</b></div>
<div class="g2">${[["🆔",U.uid,"USER ID"],["👛",M(U.balance),"TOTAL WALLET"],["➕",M(U.added),"TOTAL ADDED"],["🪙",U.coins,"TOTAL COINS"],["🛒",M(U.spent),"TOTAL SPENT"],["📦",U.orders,"TOTAL ORDERS"]].map(x=>`<div class="card" style="text-align:center;margin:0"><div style="font-size:26px">${x[0]}</div><b style="font-size:20px;color:#1d4ed8">${x[1]}</b><div class="m">${x[2]}</div></div>`).join("")}</div><div style="height:12px"></div>
<button class="w r" onclick="act('logout').then(()=>{U=null;draw()})">Logout</button>`+foot()}
const TABS=[["home","🏠","Home"],["wallet","💵","Add Wallet"],["orders","🕘","Orders"],["spin","🎡","Spin"],["msg","✈","Message"]];
const go2=t=>{DR=0;tab=t;draw();scrollTo(0,0)};

const v={home,matches,wallet,checkout,spin,orders,tx,prod,me:me_}[tab];let b="";try{b=await v()}catch(e){b=`<p>${esc(e.message)}</p>`}
$("#app").innerHTML=`<header><span class="logo" onclick="go2('home')">${esc(C.site)}</span><span><span class="pill">💰 ${M(U.balance)}</span><span class="av2" onclick="DR=1;draw()">${esc(U.username[0].toUpperCase())}</span></span></header><main>${b}</main>`+
(DR?`<div class="dr" onclick="DR=0;draw()"><div onclick="event.stopPropagation()"><div style="text-align:center;margin-bottom:14px"><div class="av">${esc(U.username[0].toUpperCase())}</div><b>${esc(U.username)}</b></div>
<a onclick="go2('me')">👤 My Profile</a><a onclick="go2('wallet')">💵 Add Money</a><a onclick="go2('orders')">🧾 My Order</a><a onclick="go2('tx')">🔁 My Transaction</a><a onclick="go2('spin')">🎡 Spin</a><a onclick="open(C.telegram)">▶ Tutorials</a><a onclick="DR=0;DP?(DP.prompt(),DP=null):alert('Browser menu theke Add to Home screen korun');draw()">⬇ Install App</a></div></div>`:"");
$("#inst").innerHTML=DP?`<div class="inst"><span>📲 Install ${esc(C.site)} app</span><button onclick="DP.prompt();DP=null;$('#inst').innerHTML=''">Install</button></div>`:""}

setInterval(()=>document.querySelectorAll(".cd").forEach(e=>{const t=new Date(e.dataset.t)-Date.now();if(isNaN(t))return e.textContent="TBA";if(t<=0)return e.textContent="Started";
const p=n=>String(n).padStart(2,"0");e.textContent=`${Math.floor(t/864e5)}d ${p(Math.floor(t/36e5)%24)}:${p(Math.floor(t/6e4)%60)}:${p(Math.floor(t/1e3)%60)}`}),1000);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e;if(U)draw()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");
(async()=>{C=await fetch("/api/config",{cache:"no-store"}).then(r=>r.json());document.title=C.site;const dq=new URLSearchParams(location.search).get("dep");if(dq){history.replaceState(null,"","/");tab="wallet";setTimeout(()=>alert(dq=="ok"?"✅ Payment safol! Balance add hoyeche":dq=="cancel"?"Payment cancel hoyeche":"Payment verify hoyni. Balance na ashle support e jogajog korun"),900)}load()})();
</script></body></html>
