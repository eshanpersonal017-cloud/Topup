<!doctype html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d28d9">
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><title>Top-up</title>
<style>
:root{--g:linear-gradient(135deg,#1e40af,#0b1d4d);--ac:#2563eb;--gold:#b45309;--bd:#e2e8f0;--m:#64748b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#0f172a;min-height:100vh;padding-bottom:84px;background:#eef1fb}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;position:sticky;top:0;z-index:5;background:#fff;box-shadow:0 2px 12px #0f172a14}
.logo{font-weight:900;letter-spacing:.5px;color:#1e3a8a;font-size:20px}
.pill{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;border-radius:99px;padding:5px 11px;font-size:13px;font-weight:800}.gold{color:var(--gold)}
.av2{display:inline-flex;width:34px;height:34px;border-radius:50%;background:#334155;color:#fff;align-items:center;justify-content:center;font-weight:800;margin-left:8px}
main{padding:14px;max-width:560px;margin:auto}h3{margin:16px 0 10px;font-size:16px;color:#1e3a8a}h3.sec{text-align:center;color:#0f172a;letter-spacing:.3px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 18px #1e3a8a14}
.hero{border-radius:18px;padding:20px;margin-bottom:14px;background:linear-gradient(135deg,#0b1d4d,#2563eb);color:#fff;box-shadow:0 10px 30px #1e40af44;position:relative;overflow:hidden}
.hero:after{content:"🏆";position:absolute;right:12px;bottom:-8px;font-size:84px;opacity:.25}.hero h2{margin:0 0 4px}
input,select{width:100%;padding:13px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:#fff;color:#0f172a;font-size:15px;outline:0}
input:focus,select:focus{border-color:var(--ac)}
button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px #1e3a8a40}
button:disabled{opacity:.45}button.g{background:#e2e8f0;color:#1e293b;box-shadow:none}button.r{background:#dc2626;box-shadow:none}button.ok{background:#16a34a;box-shadow:none}button.w{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.m{color:var(--m);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tl{background:#fff;border-radius:14px;overflow:hidden;text-align:center;box-shadow:0 4px 14px #1e3a8a1f;border-bottom:3px solid var(--ac);cursor:pointer}.tl:active{transform:scale(.96)}
.tl i{display:block;font-style:normal;font-size:38px;padding:18px 0;background:linear-gradient(160deg,#0f172a,#1e3a8a)}.tl b{display:block;font-size:12px;padding:8px 4px}
.op{display:flex;justify-content:space-between;gap:6px;border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:12px;background:#fff;cursor:pointer}.op.on{border-color:var(--ac);box-shadow:0 0 0 2px #2563eb33}.op b{color:#1d4ed8;white-space:nowrap}
.sn{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--g);color:#fff;align-items:center;justify-content:center;font-size:13px;margin-right:8px}
.pay{border:2px solid var(--ac);border-radius:12px;text-align:center;overflow:hidden;margin-bottom:10px}.pay div{padding:18px;font-weight:900;color:#1e3a8a}.pay b{display:block;background:var(--g);color:#fff;font-size:12px;padding:6px}
.stat{background:#f1f5f9;border-radius:10px;padding:10px;font-size:12.5px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}.g2 .stat{display:block}.stat b{color:#1d4ed8;font-size:14px}.g2 .stat b{display:block}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:4px;margin-bottom:12px}.seg a{flex:1;text-align:center;padding:10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--m)}.seg a.on{background:var(--g);color:#fff}
.bar{height:7px;border-radius:9px;background:#e2e8f0;margin:8px 0;overflow:hidden}.bar div{height:100%;background:var(--g)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;box-shadow:0 -2px 14px #0f172a14;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav a{flex:1;text-align:center;font-size:11px;color:var(--m);padding:5px 0;font-weight:600}nav a i{display:block;font-style:normal;font-size:21px}nav a.on{color:#1d4ed8}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chips a{white-space:nowrap;padding:8px 14px;border-radius:99px;background:#e2e8f0;font-size:13px;font-weight:700;color:var(--m);text-transform:capitalize}.chips a.on{background:var(--g);color:#fff}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:#f1f5f9}
.modal{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}.modal .card{max-width:340px;text-align:center}
#wh{width:270px;height:270px;border-radius:50%;margin:10px auto;position:relative;border:6px solid #1e3a8a;box-shadow:0 0 30px #2563eb66;transition:transform 4.5s cubic-bezier(.12,.7,.1,1)}
#wh b{position:absolute;left:50%;top:50%;width:30px;height:20px;margin:-10px 0 0 -15px;text-align:center;font-size:14px;color:#fff;text-shadow:0 1px 3px #000}
.ptr{text-align:center;font-size:30px;margin-bottom:-24px;position:relative;z-index:2;color:#f59e0b}
.inst{position:fixed;left:12px;right:12px;bottom:76px;z-index:7;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:0 6px 24px #0f172a33;font-size:13px}
.av{width:78px;height:78px;border-radius:50%;background:#334155;color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;margin:0 auto 8px;border:3px solid #fff}
.nt{display:flex;gap:8px;align-items:center;background:#fff;border-radius:99px;padding:6px 8px;margin-bottom:12px;font-size:13px;box-shadow:0 2px 10px #1e3a8a14}.nt b{background:#1d4ed8;color:#fff;border-radius:99px;padding:4px 10px;font-size:11px}
.nt span{display:inline-block;white-space:nowrap;animation:mq 14s linear infinite}@keyframes mq{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
footer{background:linear-gradient(160deg,#050b1f,#1e3a8a);color:#e2e8f0;padding:20px 16px;margin:22px -14px -14px}.fh{font-size:11px;letter-spacing:1.5px;font-weight:800;margin:14px 0 10px;color:#93c5fd}
.fl{display:flex;gap:12px;align-items:center;background:#ffffff12;border:1px solid #ffffff22;border-radius:12px;padding:12px;margin-bottom:10px;color:#fff;text-decoration:none}
.dr{position:fixed;inset:0;background:#0008;z-index:30}.dr>div{position:absolute;right:0;top:0;bottom:0;width:78%;max-width:300px;background:#fff;padding:20px;overflow:auto}.dr a{display:block;padding:13px;border-radius:10px;font-weight:700;background:#f1f5f9;margin-bottom:8px}
</style></head><body><div id="app"></div><div id="inst"></div><nav id="nav"></nav><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);let U=null,C={},PG="",SEL=0,PKS=[],DR=0,tab="home",AS="stats",mt="list",DP=null,ROT=0;
async function api(p,b){const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});
const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Error");return j}
async function act(p,b,ok){try{await api(p,b||{});await load();if(ok)alert(ok)}catch(e){alert(e.message)}}
const val=k=>$("#f_"+k).value;
async function sub(ep,ks,ok){const b={};ks.split(",").forEach(k=>b[k]=val(k));await act(ep,b,ok||"Done")}
const F=(ep,fs,btn,ok)=>`<div class="card">${fs.map(f=>(f[3]!==undefined?`<div class="m" style="margin-top:8px">${esc(f[1])}</div>`:"")+`<input id="f_${f[0]}" placeholder="${f[1]}" ${f[2]?`type="${f[2]}"`:""} value="${esc(f[3]||"")}">`).join("")}<button class="w" onclick="sub('${ep}','${fs.map(f=>f[0])}','${ok||""}')">${btn}</button></div>`;
const M=n=>"৳"+(+n).toFixed(n%1?2:0);
const st={pending:"#f59e0b",approved:"#22c55e",done:"#22c55e",paid:"#22c55e",rejected:"#ef4444",cancelled:"#ef4444",open:"#22c55e"};
const LB={done:"Completed",pending:"Pending",cancelled:"Cancelled",approved:"Approved",paid:"Paid",rejected:"Rejected"};
const tg=s=>`<span class="tag" style="color:${st[s]||"#0f172a"}">${esc(LB[s]||s)}</span>`;
const R=(t,s,x,b="")=>`<div class="card"><div class="row"><div>${t}<div class="m">${x}</div></div>${tg(s)}</div>${b?`<div class="row" style="margin-top:10px">${b}</div>`:""}</div>`;
async function load(){try{U=await api("me")}catch{U=null}draw()}
let AM="login",SE="",SD={};
function gbtn(){const g=$("#gb");if(!g)return;
if(!C.google){g.innerHTML='<span class="m">Google login ekhono chalu nai (Admin > Settings > google_client_id)</span>';return}
if(!(window.google&&google.accounts)){if(!window._gl){window._gl=1;const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=gbtn;
s.onerror=()=>{window._gl=0;g.innerHTML='<span class="m">Google script load hoy nai. Internet/adblock check korun</span>'};document.head.appendChild(s)}else setTimeout(gbtn,300);return}
google.accounts.id.initialize({client_id:C.google,callback:async r=>{try{U=await api("google",{credential:r.credential});draw()}catch(e){alert(e.message)}}});
g.innerHTML="";google.accounts.id.renderButton(g,{theme:"filled_black",size:"large",text:"continue_with",shape:"pill",width:Math.min(300,innerWidth-80)})}
function auth(){setTimeout(gbtn,50);const s=AM=="signup",v=AM=="verify";
const head=`<div class="logo" style="font-size:34px">${esc(C.site)}</div><p class="m">Game top-up · Tournament · Daily rewards</p>`;
if(v)return `<main style="padding-top:60px;text-align:center">${head}<div class="card" style="text-align:left"><div style="text-align:center;font-weight:800;font-size:16px;margin:2px 0 6px">Email verify korun</div>
<p class="m" style="text-align:center">6 digit code pathano hoyeche:<br><b class="gold">${esc(SE)}</b></p>
<input id="cd" inputmode="numeric" maxlength="6" placeholder="6 digit code" autocomplete="one-time-code" style="text-align:center;font-size:22px;letter-spacing:8px">
<button class="w" style="margin-top:8px" onclick="sVerify()">Verify & Create account</button>
<div class="m" style="text-align:center;margin-top:14px"><a style="color:#a855f7;font-weight:700" onclick="sResend()">Code abar pathan</a> · <a style="color:#a855f7;font-weight:700" onclick="AM='signup';draw()">Email change</a></div></div></main>`;
return `<main style="padding-top:60px;text-align:center">${head}
<div class="card" style="text-align:left"><div style="text-align:center;font-weight:800;font-size:16px;margin:2px 0 8px">${s?"Create account":"Welcome back"}</div>
<input id="u" placeholder="Username" autocomplete="username" value="${s?esc(SD.username||""):""}">${s?`<input id="e" type="email" placeholder="Email address" autocomplete="email" value="${esc(SD.email||"")}">`:""}<input id="p" type="password" placeholder="Password" autocomplete="${s?"new-password":"current-password"}">${s?'<input id="p2" type="password" placeholder="Confirm password" autocomplete="new-password">':""}
${s?`<button class="w" style="margin-top:8px" onclick="sStart()">Send verification code</button>`:`<div class="row" style="margin-top:8px"><button class="w" onclick="go('login')">Login</button><button class="w g" onclick="AM='signup';draw()">Sign up</button></div>`}
<div class="m" style="text-align:center;margin:14px 0 4px">— or —</div><div id="gb" style="margin-top:8px;display:flex;justify-content:center;text-align:center"></div>
${s?`<div class="m" style="text-align:center;margin-top:14px">Already account ache? <a style="color:#a855f7;font-weight:700" onclick="AM='login';draw()">Login</a></div>`:""}</div></main>`}
async function go(k){try{U=await api(k,{username:$("#u").value,password:$("#p").value});draw()}catch(e){alert(e.message)}}
async function sStart(){try{const d={username:$("#u").value,email:$("#e").value.trim(),password:$("#p").value};if($("#p2").value!==d.password)return alert("Password duita mile nai");
await api("signup/start",d);SD=d;SE=d.email.toLowerCase();AM="verify";draw()}catch(e){alert(e.message)}}
async function sVerify(){try{U=await api("signup/verify",{email:SE,code:$("#cd").value});AM="login";SD={};draw()}catch(e){alert(e.message)}}
async function sResend(){try{await api("signup/start",SD);alert("Notun code pathano hoyeche")}catch(e){alert(e.message)}}
const ic=n=>/diamond/i.test(n)?"💎":/member/i.test(n)?"🎫":/uc/i.test(n)?"🎯":/level/i.test(n)?"⭐":/vpn/i.test(n)?"🛡️":/gift|card/i.test(n)?"🎁":"🎮";
const foot=()=>`<footer><div class="fh">CUSTOMER SUPPORT</div><a class="fl" href="${esc(C.telegram)}" target="_blank"><span style="font-size:22px">✈</span><div><div style="font-size:11px;color:#cbd5e1">9AM – 11PM Daily</div><b>Telegram Support</b></div></a><a class="fl" href="${esc(C.telegram)}" target="_blank"><span style="font-size:22px">📢</span><div><div style="font-size:11px;color:#cbd5e1">Telegram Channel</div><b>Join Now</b></div></a><div class="fh">STAY CONNECTED</div><div class="fl"><b>${esc(C.site)}</b></div></footer>`;
function openP(n){PG=n;SEL=0;tab="prod";draw();scrollTo(0,0)}
async function home(){const [ps,lt]=await Promise.all([api("packages"),api("latest")]),S={};
ps.forEach(p=>{const s=p.section||"TOPUP";((S[s]??={})[p.game]??=[]).push(p)});
const pop=!sessionStorage.pop?(sessionStorage.pop=1,`<div class="modal" onclick="this.remove()"><div class="card"><h2 style="margin-top:0">🎁 Offer</h2><p>${esc(C.popup)}</p><button onclick="tab='matches';draw()">Join Now</button></div></div>`):"";
return pop+`<div class="nt"><b>NOTICE</b><div style="overflow:hidden;flex:1"><span>${esc(C.notice)}</span></div></div>
<div class="hero"><h2>FREE TOURNAMENT</h2><div style="opacity:.9;margin-bottom:12px">Match khelun, puroskar jitun!</div><button class="g" onclick="tab='matches';draw()">Join Now →</button></div>
<h3 class="sec">🎉 OFFERS 🎊</h3><div class="grid"><div class="tl" onclick="tab='matches';draw()"><i>🏆</i><b>FREE</b></div></div>`+
Object.entries(S).map(([s,g])=>`<h3 class="sec">${esc(s)}</h3><div class="grid">${Object.keys(g).map(n=>`<div class="tl" data-g="${esc(n)}" onclick="openP(this.dataset.g)"><i>${ic(n+" "+g[n][0].name)}</i><b>${esc(n)}</b></div>`).join("")}</div>`).join("")+
`<h3 class="sec">LATEST ORDERS</h3>`+(lt.map(x=>`<div class="card row" style="padding:10px 14px"><div><b>${esc(x.username)}</b><div class="m">${esc(x.package)} · ${esc(x.created)}</div></div>${tg("done")}</div>`).join("")||'<p class="m" style="text-align:center">Ekhono kono order nai</p>')+foot()}
async function prod(){PKS=(await api("packages")).filter(p=>p.game==PG);const sp=PKS.find(p=>p.id==SEL),low=sp&&U.balance<sp.price;
return `<div class="card"><h3 style="margin-top:0"><span class="sn">1</span>Select Recharge</h3><div class="g2">${PKS.map(p=>`<div class="op ${p.id==SEL?"on":""}" onclick="SEL=${p.id};draw()"><span>${ic(p.name)} ${esc(p.name)}</span><b>${M(p.price)}</b></div>`).join("")}</div>${low?`<p style="color:#dc2626;font-size:13px">⚠ You do not have enough money to order this package, Please <a style="color:#2563eb;font-weight:700" onclick="tab='wallet';draw()">Add Money</a> or choose another package.</p>`:""}</div>
<div class="card"><h3 style="margin-top:0"><span class="sn">2</span>Account Info</h3><div class="m">Player ID</div><input id="pid" inputmode="numeric" placeholder="Enter Player ID" value="${esc(localStorage.pid||"")}" oninput="localStorage.pid=this.value"><button onclick="chk()">Check Player ID</button></div>
<div class="card"><h3 style="margin-top:0"><span class="sn">3</span>Select Payment</h3><div class="pay"><div>${esc(C.site)}</div><b>WALLET PAY</b></div><div class="stat"><span>Your account balance:</span><b>${M(U.balance)}</b></div>${sp?`<div class="stat"><span>You need to purchase this product:</span><b>${M(sp.price)}</b></div>`:""}</div>
<div class="card row">${low?`<button class="g w" onclick="tab='wallet';draw()">Add Money</button>`:""}<button class="w" ${sp&&!low?"":"disabled"} onclick="buy(${sp?sp.id:0})">Buy Now</button></div>
<div class="card"><h3 style="margin-top:0"><span class="sn">4</span>Rules &amp; Conditions</h3><div style="font-size:13px;line-height:1.7;white-space:pre-line">${esc(C.rules)}</div></div>`+foot()}
const okid=v=>/^\d{5,15}$/.test(v);
function chk(){const v=$("#pid").value.trim();alert(okid(v)?"✅ Player ID thik ache: "+v:"Player ID 5-15 digit hote hobe")}
async function buy(id){const p=PKS.find(x=>x.id==id),v=$("#pid").value.trim();if(!p)return;if(!okid(v))return alert("Sothik Player ID din");
if(!confirm(`${p.name} — ${M(p.price)}\nPlayer ID: ${v}\nOrder korben?`))return;
try{await api("order",{package_id:id,player_id:v});alert("✅ Order hoyeche!");tab="orders";await load()}catch(e){alert(e.message)}}
async function orders(){const h=await api("history");return `<h3 class="sec">My Orders</h3>`+(h.orders.map(o=>`<div class="card"><div class="row"><b>Order Id: ${o.id}</b>${tg(o.status)}</div><div class="m" style="margin-top:6px;line-height:1.8">Date: ${esc(o.created)}<br>Total Price: ${M(o.price)}<br>Player Id: ${esc(o.player_id)}<br>Package: ${esc(o.package)}</div></div>`).join("")||'<p class="m" style="text-align:center">Kono order nai</p>')+foot()}
async function tx(){const h=await api("history");return `<h3 class="sec">My Transactions</h3><div class="card" style="overflow-x:auto"><table style="width:100%;font-size:12.5px;border-collapse:collapse"><tr class="m"><td>Amount</td><td>TrxID</td><td>Status</td><td>Date</td></tr>${h.deposits.map(d=>`<tr><td style="padding:8px 0"><b>${M(d.amount)}</b></td><td>${esc(d.trx)}</td><td>${tg(d.status)}</td><td>${esc(d.created)}</td></tr>`).join("")||'<tr><td class="m">Kichu nai</td></tr>'}</table></div>`+foot()}
async function matches(){const t=await api("tournaments");const L=mt=="list"?t.filter(x=>!x.mine||x.status=="open"):t.filter(x=>x.mine);
return `<div class="seg"><a class="${mt=="list"?"on":""}" onclick="mt='list';draw()">Match List</a><a class="${mt=="hist"?"on":""}" onclick="mt='hist';draw()">History</a></div>`+
(L.map(x=>{const full=x.joined>=x.slots;return `<div class="card"><div class="row"><b>${esc(x.title)}</b>${tg(x.status)}</div>
<div class="g2" style="margin-top:10px"><div class="stat">Prize<b>${M(x.prize)}</b></div><div class="stat">Type<b>${esc(x.mode)}</b></div><div class="stat">Entry<b>${M(x.entry)}</b></div><div class="stat">Per kill<b>${M(x.per_kill)}</b></div></div>
<div class="m" style="margin-top:8px">Min Level ${x.min_level} · Registration ${x.joined}/${x.slots}</div><div class="bar"><div style="width:${Math.min(100,x.joined/x.slots*100)}%"></div></div>
<div class="m" style="text-align:center">⏰ Starts in <b class="cd gold" data-t="${esc(x.start)}">--</b></div>
<div class="row" style="margin-top:10px">${x.mine?"<button class='w ok'>✔ Joined</button>":`<button class="w" ${full||x.status!="open"?"disabled":""} onclick="jn(${x.id},${x.entry})">${full?"Full":"Join Match"}</button>`}
<button class="g" onclick="alert('Rules:\\n1. Hack/cheat korle ban\\n2. Room ID/Password keu k dibena\\n3. Shuru hower 5 min age room e dhukun')">Rules</button>
<button class="g" onclick="alert(${x.mine?`'Room ID: ${esc(x.room_id)||"-"}\\nPassword: ${esc(x.room_pass)||"-"}'`:"'Age match join korun'"})">Room</button></div></div>`}).join("")||'<p class="m" style="text-align:center">Kono match nai</p>')}
function jn(id,e){const n=prompt("Apnar in-game name?");if(n&&confirm(`Entry fee ${M(e)} katbe. Join korben?`))act(`tournament/${id}/join`,{ign:n},"✅ Joined!")}
async function wallet(){const h=await api("history");
return `<div class="hero"><div class="m" style="color:#fff9">Wallet Balance</div><h2 style="font-size:34px;margin:2px 0">${M(U.balance)}</h2><div>🪙 ${U.coins} coins</div></div>
<div class="card"><b>➕ Add Money</b><select id="dm" onchange="$('#pn').textContent=C.methods.find(m=>m.m==this.value).n">${C.methods.map(m=>`<option>${esc(m.m)}</option>`).join("")}</select>
<p class="m">Ei number/address e Send Money korun: <b class="gold" id="pn">${esc(C.methods[0].n)}</b></p><input id="da" type="number" placeholder="Amount (৳)"><input id="dt" placeholder="Transaction ID">
<button class="w" onclick="act('deposit',{method:val('dm'),amount:val('da'),trx:val('dt')},'Request pathano hoyeche. Admin approve korle balance ashbe')">Submit</button></div>

async function spin(){const s=await api("spins"),W=C.wheel,col=["#ef4444","#f59e0b","#22c55e","#06b6d4","#6366f1","#a855f7","#ec4899","#f97316"];
const bg=W.map((_,i)=>`${col[i]} ${i*45}deg ${(i+1)*45}deg`).join(",");
return `<div class="card" style="text-align:center"><h3 style="margin-top:0">🎡 Daily Spin</h3><div class="ptr">▼</div><div id="wh" style="background:conic-gradient(${bg});transform:rotate(${ROT}deg)">${W.map((w,i)=>`<b style="transform:rotate(${i*45+22.5}deg) translateY(-98px)">${w}</b>`).join("")}</div>
<p class="m">Remaining today: ${U.can_spin?1:0} / 1 · 100 coin = ৳10</p><div class="row"><button class="w" ${U.can_spin?"":"disabled"} onclick="doSpin()">SPIN</button><button class="w g" onclick="act('redeem',{},'Coin balance e add hoyeche')">Redeem ${U.coins} 🪙</button></div></div>
<h3>Recent Winners</h3>`+s.map(x=>`<div class="card row"><span>🏅 ${esc(x.username)}</span><b class="gold">${x.coins} Coins</b><span class="m">${x.created}</span></div>`).join("")}
async function doSpin(){try{const r=await api("spin",{});ROT=360*6-(r.idx*45+22.5);$("#wh").style.transform=`rotate(${ROT}deg)`;setTimeout(async()=>{alert(`🎉 Apni ${r.won} coin jitechen!`);await load()},4700)}catch(e){alert(e.message)}}
async function me_(){return `<div class="card" style="text-align:center;background:var(--g);color:#fff"><div class="av">${esc(U.username[0].toUpperCase())}</div><b style="font-size:18px">${esc(U.username)}</b></div>
<div class="g2">${[["🆔",U.uid,"USER ID"],["👛",M(U.balance),"TOTAL WALLET"],["➕",M(U.added),"TOTAL ADDED"],["🪙",U.coins,"TOTAL COINS"],["🛒",M(U.spent),"TOTAL SPENT"],["📦",U.orders,"TOTAL ORDERS"]].map(x=>`<div class="card" style="text-align:center;margin:0"><div style="font-size:26px">${x[0]}</div><b style="font-size:20px;color:#1d4ed8">${x[1]}</b><div class="m">${x[2]}</div></div>`).join("")}</div><div style="height:12px"></div>
${U.is_admin?`<button class="w" onclick="tab='adm';draw()">🛠 Admin Panel</button><div style="height:8px"></div>`:""}<button class="w r" onclick="act('logout').then(()=>{U=null;draw()})">Logout</button>`+foot()}
async function adm(){const T=["stats","deposits","orders","withdrawals","matches","packages","users","settings"];
let h=`<div class="chips">${T.map(c=>`<a class="${c==AS?"on":""}" onclick="AS='${c}';draw()">${c}</a>`).join("")}</div>`;
const A=(k,i,a,t,c="")=>`<button class="${c}" onclick="act('admin/act/${k}/${i}/${a}')">${t}</button>`;
if(AS=="stats"){const s=await api("admin/stats");h+=`<div class="g2">${Object.entries(s).map(([k,v])=>`<div class="stat">${k.replace(/_/g," ")}<b>${/balances|deposited|sales/.test(k)?M(v):v}</b></div>`).join("")}</div>`}
else if(AS=="deposits"||AS=="orders"||AS=="withdrawals"){const d=await api("admin/data/"+AS),k={deposits:"deposit",orders:"order",withdrawals:"withdraw"}[AS];
h+=d.map(x=>R(`<b>${esc(x.username)}</b> · ${esc(x.method||x.package)} ${M(x.amount??x.price)}`,x.status,esc(x.trx||x.account||"Player ID: "+x.player_id)+" · "+x.created+(x.note?"<br>"+esc(x.note):""),
x.status=="pending"?A(k,x.id,k=="order"?"done":"approve",k=="order"?"Done":"Approve","ok")+A(k,x.id,k=="order"?"cancel":"reject",k=="order"?"Cancel+Refund":"Reject","r"):"")).join("")||'<p class="m">Kichu nai</p>'}
else if(AS=="matches"){const d=await api("admin/data/tournaments");h+=F("admin/tournament",[["title","Match title (e.g. BR - Solo Match)"],["mode","SOLO / DUO / SQUAD"],["prize","Total prize","number"],["entry","Entry fee","number"],["per_kill","Per kill","number"],["min_level","Min level","number"],["slots","Slots (48)","number"],["start","","datetime-local"]],"Create Match");
h+=d.map(x=>R(`<b>${esc(x.title)}</b> · ${esc(x.mode)}`,x.status,`Prize ${M(x.prize)} · Entry ${M(x.entry)} · Joined ${x.joined}/${x.slots}<br>Room: ${esc(x.room_id)||"-"} / ${esc(x.room_pass)||"-"}`,
x.status=="open"?`<button onclick="room(${x.id})">Set Room</button><button class="ok" onclick="fin(${x.id})">Finish & Pay</button>`:"")).join("")}
else if(AS=="packages"){const d=await api("admin/data/packages");h+=F("admin/package",[["game","Category (UID TOPUP, Level Up Pass...)"],["section","Section (FREE FIRE TOPUP / OTHERS GAME / BUY - SELL)"],["name","Package name"],["price","Price","number"],["code","Supplier product code (auto topup er jonno)"]],"Add Package");
h+=d.map(x=>R(`${esc(x.game)} · ${esc(x.name)}`,M(x.price),"Code: "+(esc(x.code)||"-"),`<button onclick="pcode(${x.id})">Set Code</button><button class="r" onclick="if(confirm('Delete?'))act('admin/package/${x.id}/delete')">Delete</button>`).replace(/<span class="tag"[^>]*>/,'<span class="tag gold">')).join("")}
else if(AS=="users"){const d=await api("admin/data/users");h+=d.map(x=>R(`<b>${esc(x.username)}</b> (#${10000+x.id})`,x.banned?"banned":"active",`${M(x.balance)} · 🪙 ${x.coins}`,
`<button onclick="adj(${x.id})">± Balance</button>`+(x.is_admin?"":`<button class="${x.banned?"ok":"r"}" onclick="act('admin/user/${x.id}/${x.banned?"unban":"ban"}')">${x.banned?"Unban":"Ban"}</button>`))).join("")}
else{const s=await api("admin/data/settings");h+=F("admin/settings",Object.keys(s).map(k=>[k,k,"",s[k]]),"Save Settings","Saved! Reload korle apply hobe")}
return h}
