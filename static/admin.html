<!doctype html><html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020">
<title>Admin Panel</title>
<style>
:root{--bg:#0a0f1f;--sf:#111a33;--sf2:#16213f;--bd:#ffffff14;--tx:#e8edfb;--mu:#8b97b8;--ac:linear-gradient(135deg,#6366f1,#8b5cf6 60%,#d946ef);--ok:#22c55e;--no:#ef4444;--wa:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(700px 400px at 90% -10%,#6d28d933,transparent),radial-gradient(600px 400px at -10% 20%,#2563eb26,transparent),var(--bg);color:var(--tx);min-height:100vh}
a{cursor:pointer}.mu{color:var(--mu);font-size:12.5px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.gap{display:flex;gap:8px;flex-wrap:wrap}
#side{position:fixed;top:0;bottom:0;left:0;width:260px;background:#0d1530f2;backdrop-filter:blur(18px);border-right:1px solid var(--bd);padding:18px 12px;z-index:30;transform:translateX(-100%);transition:.25s;overflow:auto}
#side.on{transform:none}#ov{position:fixed;inset:0;background:#0009;z-index:25;display:none}#ov.on{display:block}
.brand{font-weight:900;font-size:20px;padding:6px 10px 18px;background:var(--ac);-webkit-background-clip:text;background-clip:text;color:transparent}
.nv{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;color:var(--mu);font-weight:600;font-size:14.5px;margin-bottom:4px}.nv.on{background:var(--ac);color:#fff;box-shadow:0 8px 24px #7c3aed55}.nv i{font-style:normal;font-size:18px;width:22px;text-align:center}
.bd{margin-left:auto;background:var(--no);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:2px 8px}.nv.on .bd{background:#fff;color:#6d28d9}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 14px;background:#0a0f1fe6;backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
#top h1{font-size:17px;margin:0;flex:1}.ib{width:38px;height:38px;border-radius:11px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);display:flex;align-items:center;justify-content:center;font-size:18px}
main{padding:14px;max-width:980px;margin:auto;padding-bottom:60px}
.card{background:linear-gradient(160deg,#16213fcc,#111a33cc);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sc{border-radius:16px;padding:14px;position:relative;overflow:hidden;border:1px solid var(--bd)}.sc b{display:block;font-size:22px;margin-top:4px}.sc span{font-size:12px;opacity:.85}.sc:after{content:attr(data-i);position:absolute;right:8px;bottom:-6px;font-size:44px;opacity:.18}
.c1{background:linear-gradient(135deg,#4f46e5,#7c3aed)}.c2{background:linear-gradient(135deg,#0891b2,#2563eb)}.c3{background:linear-gradient(135deg,#059669,#16a34a)}.c4{background:linear-gradient(135deg,#d97706,#ea580c)}.c5{background:linear-gradient(135deg,#be185d,#e11d48)}.c6{background:linear-gradient(135deg,#7c3aed,#c026d3)}.c7{background:linear-gradient(135deg,#0f766e,#0d9488)}
h2{font-size:15px;margin:18px 0 10px}.pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:#ffffff14;white-space:nowrap}
.btn{background:var(--ac);color:#fff;border:0;border-radius:11px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 6px 18px #7c3aed44}.btn.s{padding:7px 12px;font-size:12.5px}.btn.g{background:#ffffff14;box-shadow:none}.btn.ok{background:var(--ok);box-shadow:none}.btn.no{background:var(--no);box-shadow:none}.btn.w{width:100%}
input,select,textarea{width:100%;padding:12px;margin:5px 0 10px;border:1px solid var(--bd);border-radius:11px;background:#0b1226;color:var(--tx);font-size:14.5px;outline:0;font-family:inherit}input:focus,select:focus,textarea:focus{border-color:#8b5cf6}textarea{min-height:90px;resize:vertical}label{font-size:12px;color:var(--mu);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chips a{white-space:nowrap;padding:8px 14px;border-radius:99px;background:var(--sf);border:1px solid var(--bd);font-size:13px;font-weight:700;color:var(--mu)}.chips a.on{background:var(--ac);color:#fff;border-color:transparent}
.tg{width:44px;height:24px;border-radius:99px;background:#334155;position:relative;display:inline-block;flex:none}.tg:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--ok)}.tg.on:after{left:23px}
.sh{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sb{background:#0f172e;border:1px solid var(--bd);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#16a34a;color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:99;box-shadow:0 10px 30px #0008}.toast.bad{background:#dc2626}
.thumb{width:44px;height:44px;border-radius:10px;background:var(--sf2) center/cover;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
#login{max-width:380px;margin:12vh auto;padding:0 18px;text-align:center}#login .brand{font-size:30px;padding-bottom:6px}
@media(min-width:900px){#side{transform:none}#top,main{margin-left:260px}#top .ib.m{display:none}#ov{display:none!important}.st{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const M=n=>"৳"+(+n||0).toLocaleString("en-US",{maximumFractionDigits:2});
async function api(p,b){const r=await fetch("/api/"+p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Error");return j}
function toast(m,bad){const t=document.createElement("div");t.className="toast"+(bad?" bad":"");t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const doit=async(f,ok)=>{try{await f();if(ok)toast(ok);await go()}catch(e){toast(e.message,1)}};
const v=k=>$("#f_"+k).value,fld=(k,l,val="",t="text")=>`<label>${l}</label><input id="f_${k}" type="${t}" value="${esc(val)}">`;
function sheet(title,body,save,label="Save"){const d=document.createElement("div");d.className="sh";d.innerHTML=`<div class="sb"><div class="row" style="margin-bottom:10px"><b>${title}</b><a class="ib" onclick="this.closest('.sh').remove()">✕</a></div>${body}<button class="btn w" id="shok">${label}</button></div>`;
document.body.appendChild(d);d.onclick=e=>{if(e.target==d)d.remove()};$("#shok").onclick=async()=>{try{await save();d.remove();await go()}catch(e){toast(e.message,1)}}}
const NAV=[["dash","📊","Dashboard"],["orders","🧾","Orders"],["deps","💳","Deposits"],["sms","📩","SMS Inbox"],["prod","📦","Products"],["users","👥","Users"],["match","🏆","Tournaments"],["set","⚙️","Site Settings"]];
let P="dash",FL="all",ST={},ME=null,Q="",SG="General",DATA={};
const SG_=[["General","🏠",[["site","Site name"],["telegram","Telegram link"],["notice","Notice ticker (home)"],["popup","Home popup text"],["rules","Rules & Conditions (order page)","ta"],["coin_rate","Coin reward per 100৳ order (0 = off)"],["pending_note","Pending order note","ta"]]],
["Banner","🖼️",[["banner_title","Banner title"],["banner_text","Banner text"],["banner_img","Banner image URL"]]],
["Payment","💳",[["sms_secret","SMS secret (TrxID auto verify)","pw"],["wm_public","Waitmark Public Key (pk_live_...)"],["wm_secret","Waitmark Secret Key (sk_live_...)","pw"],["pay_url","Gateway URL (optional)"],["pay_key","Auto payment: API key","pw"],["pay_bKash","Manual: bKash number"],["pay_Nagad","Manual: Nagad number"],["pay_Rocket","Manual: Rocket number"],["pay_Binance","Manual: Binance"],["pay_Bybit","Manual: Bybit"]]],
["Email","✉️",[["mail_url","Apps Script URL"],["mail_secret","Apps Script secret","pw"],["mail_key","Brevo API key (optional)","pw"],["mail_from","Brevo sender email"]]],
["Player Check","🔍",[["uid_url","Lookup URL (jekhane {uid} thakbe)"],["uid_key","API Key (header e jabe, URL e na)","pw"],["uid_header","Key header naam (default x-api-key)"],["uid_name_field","Name field (jemon nickname)"],["uid_level_field","Level field (jemon level)"]]],
["Google","🔑",[["google_client_id","Google Client ID"]]],
["Auto Top-up","⚡",[["auto_topup","Auto top-up (on/off)"],["sup_url","Supplier URL"],["sup_key","Supplier key","pw"],["sup_header","Header name"],["sup_prefix","Header prefix"],["sup_body","Request body","ta"],["sup_ok_field","Success field"],["sup_ok_value","Success value"],["sup_fail_values","Fail values"]]]];
function shell(b){const ct=ST.pending_orders||0,cd=ST.pending_deposits||0;return `<div id="ov" onclick="menu(0)"></div><aside id="side"><div class="brand">⚡ ${esc(ME.site||"ADMIN")}</div>${NAV.map(n=>`<a class="nv ${n[0]==P?"on":""}" onclick="nav('${n[0]}')"><i>${n[1]}</i>${n[2]}${n[0]=="orders"&&ct?`<span class="bd">${ct}</span>`:""}${n[0]=="deps"&&cd?`<span class="bd">${cd}</span>`:""}</a>`).join("")}
<a class="nv" onclick="open('/','_blank')"><i>🌐</i>View Website</a><a class="nv" onclick="logout()"><i>🚪</i>Logout</a></aside>
<div id="top"><a class="ib m" onclick="menu(1)">☰</a><h1>${NAV.find(n=>n[0]==P)[2]}</h1><a class="ib" onclick="go()">⟳</a></div><main>${b}</main>`}
const menu=o=>{$("#side").classList.toggle("on",!!o);$("#ov").classList.toggle("on",!!o)};
const nav=p=>{P=p;FL="all";Q="";go();scrollTo(0,0)};
async function logout(){await api("logout",{}).catch(()=>{});ME=null;boot()}
const pill=s=>{const c={pending:"#f59e0b",done:"#22c55e",approved:"#22c55e",cancelled:"#ef4444",rejected:"#ef4444",open:"#22c55e"}[s]||"#8b97b8";return `<span class="pill" style="color:${c}">${esc(s)}</span>`};
const chips=(L)=>`<div class="chips">${L.map(x=>`<a class="${x==FL?"on":""}" onclick="FL='${x}';go()" style="text-transform:capitalize">${x}</a>`).join("")}</div>`;
async function dash(){const [s,o]=[ST,await api("admin/data/orders")];const C=[["c1","👥","Users",s.users],["c2","👛","Wallet balances",M(s.balances)],["c3","💰","Sales",M(s.sales)],["c4","⬇️","Deposited",M(s.deposited)],["c5","🧾","Pending orders",s.pending_orders],["c6","💳","Pending deposits",s.pending_deposits],["c7","🏆","Open matches",s.open_matches]];
return `<div class="st">${C.map(c=>`<div class="sc ${c[0]}" data-i="${c[1]}"><span>${c[2]}</span><b>${c[3]??0}</b></div>`).join("")}</div><h2>Recent orders</h2>`+o.slice(0,6).map(ordCard).join("")}
const ordCard=o=>`<div class="card"><div class="row"><b>#${o.id} · ${esc(o.username)}</b>${pill(o.status)}</div><div class="mu" style="margin:6px 0;line-height:1.7">${esc(o.package)}<br>Player ID: <b style="color:#e8edfb">${esc(o.player_id)}</b> · ${M(o.price)}<br>${esc(o.created)}${o.note?`<br>📝 ${esc(o.note)}`:""}</div>${o.status=="pending"?`<div class="gap"><button class="btn ok s" onclick="act('order',${o.id},'done')">✓ Complete</button><button class="btn no s" onclick="act('order',${o.id},'cancel')">✕ Cancel & refund</button></div>`:""}</div>`;
const act=(k,i,a)=>confirm("Nishchit?")&&doit(()=>api(`admin/act/${k}/${i}/${a}`,{}),"Done");
async function orders(){const d=await api("admin/data/orders");return chips(["all","pending","done","cancelled"])+(d.filter(x=>FL=="all"||x.status==FL).map(ordCard).join("")||'<p class="mu">Kichu nai</p>')}
async function deps(){const d=await api("admin/data/deposits");return chips(["all","pending","approved","rejected"])+(d.filter(x=>FL=="all"||x.status==FL).map(x=>`<div class="card"><div class="row"><b>${M(x.amount)} · ${esc(x.username)}</b>${pill(x.status)}</div><div class="mu" style="margin:6px 0">${esc(x.method)} · TrxID: <b style="color:#e8edfb">${esc(x.trx)}</b><br>${esc(x.created)}</div>${x.status=="pending"?`<div class="gap"><button class="btn ok s" onclick="act('deposit',${x.id},'approve')">✓ Approve</button><button class="btn no s" onclick="act('deposit',${x.id},'reject')">✕ Reject</button></div>`:""}</div>`).join("")||'<p class="mu">Kichu nai</p>')}
async function prod(){const [pk,ct]=await Promise.all([api("admin/data/packages"),api("cats")]);DATA.pk=pk;const S={};pk.forEach(p=>{((S[p.section||"TOPUP"]??={})[p.game]??=[]).push(p)});
return `<div class="row"><span class="mu">${pk.length} packages</span><button class="btn s" onclick="pkForm()">+ Add package</button></div>`+Object.entries(S).map(([s,g])=>`<h2>${esc(s)}</h2>`+Object.entries(g).map(([n,L])=>`<div class="card"><div class="row" style="margin-bottom:10px"><div class="gap" style="flex-wrap:nowrap;align-items:center"><div class="thumb" style="${ct[n]?`background-image:url(${esc(encodeURI(ct[n]))});font-size:0`:""}">🎮</div><b>${esc(n)}</b></div><button class="btn g s" data-n="${esc(n)}" data-i="${esc(ct[n]||"")}" onclick="catImg(this)">🖼 Image</button></div>`+L.map(p=>`<div class="row" style="padding:9px 0;border-top:1px solid var(--bd)"><div style="flex:1;min-width:0"><div style="font-size:14px">${esc(p.name)}</div><div class="mu">${M(p.price)}${p.code?` · code: ${esc(p.code)}`:""}</div></div><a class="tg ${p.stock?"on":""}" onclick="stock(${p.id},${p.stock?0:1})"></a><button class="btn g s" onclick="pkForm(${p.id})">✎</button><button class="btn no s" onclick="delPk(${p.id})">🗑</button></div>`).join("")+`</div>`).join("")).join("")}
const stock=(i,s)=>doit(()=>api(`admin/package/${i}/update`,{stock:s}),s?"In stock":"Out of stock");
const delPk=i=>confirm("Package delete korben?")&&doit(()=>api(`admin/package/${i}/delete`,{}),"Deleted");
function catImg(b){sheet("Category image: "+esc(b.dataset.n),fld("img","Image URL (https://...)",b.dataset.i)+'<p class="mu">Khali rakhle emoji icon dekhabe.</p>',()=>api("admin/cat",{name:b.dataset.n,img:v("img")}))}
function pkForm(id){const p=id?DATA.pk.find(x=>x.id==id):{section:"",game:"",name:"",price:"",code:"",stock:1};const dl=(i,a)=>`<datalist id="${i}">${[...new Set(DATA.pk.map(x=>x[a]))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`;
sheet(id?"Edit package":"Add package",fld("section","Section (home e heading)",p.section).replace("<input","<input list=dl1")+fld("game","Category (game/app naam)",p.game).replace("<input","<input list=dl2")+fld("name","Package naam",p.name)+fld("price","Price (৳)",p.price,"number")+fld("code","Supplier code (auto top-up, optional)",p.code||"")+dl("dl1","section")+dl("dl2","game"),
()=>api(id?`admin/package/${id}/update`:"admin/package",{section:v("section"),game:v("game"),name:v("name"),price:v("price"),code:v("code"),stock:p.stock}))}
async function users(){const d=await api("admin/data/users");DATA.us=d;const L=d.filter(u=>u.username.includes(Q.toLowerCase()));
return `<input placeholder="🔍 Username khujun" value="${esc(Q)}" oninput="Q=this.value;uList()"><div id="ul">${L.map(uCard).join("")}</div>`}
const uCard=u=>`<div class="card"><div class="row"><b>${esc(u.username)} <span class="mu">#${u.id}</span></b>${u.is_admin?'<span class="pill" style="color:#a78bfa">admin</span>':u.banned?'<span class="pill" style="color:#ef4444">banned</span>':""}</div><div class="mu" style="margin:6px 0">Balance: <b style="color:#22c55e">${M(u.balance)}</b> · 🪙 ${u.coins}</div><div class="gap"><button class="btn g s" onclick="bal(${u.id})">± Balance</button>${u.is_admin?"":`<button class="btn ${u.banned?"ok":"no"} s" onclick="ban(${u.id},'${u.banned?"unban":"ban"}')">${u.banned?"Unban":"Ban"}</button>`}</div></div>`;
const uList=()=>{$("#ul").innerHTML=DATA.us.filter(u=>u.username.includes(Q.toLowerCase())).map(uCard).join("")};
const bal=i=>sheet("Balance add / deduct",fld("d","Amount (deduct korte minus likhun, jemon -50)","","number"),()=>api(`admin/user/${i}/balance`,{delta:v("d")}));
const ban=(i,a)=>confirm(a+" korben?")&&doit(()=>api(`admin/user/${i}/${a}`,{}),"Done");
async function match(){const d=await api("admin/data/tournaments");return `<div class="row"><span class="mu">${d.length} matches</span><button class="btn s" onclick="mForm()">+ New match</button></div>`+d.map(t=>`<div class="card"><div class="row"><b>${esc(t.title)}</b>${pill(t.status)}</div><div class="mu" style="margin:6px 0;line-height:1.7">${esc(t.mode)} · Prize ${M(t.prize)} · Entry ${M(t.entry)} · Kill ${M(t.per_kill)}<br>Joined ${t.joined}/${t.slots} · ${esc(t.start)}<br>Room: ${esc(t.room_id||"-")} / ${esc(t.room_pass||"-")}</div>${t.status=="open"?`<div class="gap"><button class="btn g s" onclick="room(${t.id})">🔑 Room</button><button class="btn ok s" onclick="fin(${t.id})">🏁 Finish</button></div>`:""}</div>`).join("")}
const mForm=()=>sheet("New match",fld("title","Title")+fld("mode","Mode (SOLO/DUO/SQUAD)","SOLO")+fld("prize","Prize (৳)","","number")+fld("entry","Entry fee (৳)","","number")+fld("per_kill","Per kill (৳)","","number")+fld("min_level","Min level","0","number")+fld("slots","Slots","48","number")+fld("start","Start time"),()=>api("admin/tournament",{title:v("title"),mode:v("mode"),prize:v("prize"),entry:v("entry"),per_kill:v("per_kill"),min_level:v("min_level"),slots:v("slots"),start:v("start")}));
const room=i=>sheet("Room details",fld("r","Room ID")+fld("p","Password"),()=>api(`admin/tournament/${i}/room`,{room_id:v("r"),room_pass:v("p")}));
const fin=i=>sheet("Finish match",fld("w","Winners (username:amount, comma diye)")+'<p class="mu">Jemon: rahim:500,karim:200</p>',()=>api(`admin/tournament/${i}/finish`,{winners:v("w")}));
async function set(){const s=await api("admin/data/settings");DATA.s=s;const g=SG_.find(x=>x[0]==SG);
return `<div class="chips">${SG_.map(x=>`<a class="${x[0]==SG?"on":""}" onclick="SG='${x[0]}';go()">${x[1]} ${x[0]}</a>`).join("")}</div><div class="card">${g[2].map(f=>f[2]=="ta"?`<label>${f[1]}</label><textarea id="f_${f[0]}">${esc(s[f[0]])}</textarea>`:fld(f[0],f[1],s[f[0]],f[2]=="pw"?"password":"text")).join("")}<button class="btn w" onclick="saveS()">Save ${SG}</button>${SG=="Player Check"?ptest():""}</div><p class="mu">Ekhane ja bodlabe, user panel e sathe sathe change hobe.</p>`}
const ptest=()=>`<label style="margin-top:14px">🧪 Test (age Save korun, tarpor ekta Free Fire UID din)</label><input id="tu" placeholder="Free Fire UID"><button class="btn w" style="margin-top:8px" onclick="ptRun()">Test API</button><pre id="tr" style="white-space:pre-wrap;word-break:break-all;font-size:11px;margin-top:10px;max-height:280px;overflow:auto"></pre>`;
async function ptRun(){const o=document.getElementById("tr");o.textContent="Loading...";try{const r=await api("admin/player_test",{uid:document.getElementById("tu").value.trim()});o.textContent="HTTP "+r.http+"\nNAME: "+(r.name||"— paoa jayni")+"\nLEVEL: "+(r.level??"— paoa jayni")+"\n\nAPI reply:\n"+r.raw}catch(e){o.textContent="Error: "+e.message}}
const saveS=()=>doit(()=>api("admin/settings",Object.fromEntries(SG_.find(x=>x[0]==SG)[2].map(f=>[f[0],v(f[0])]))),"Saved ✓");
const wmcard=w=>`<div class="card"><b>💳 Waitmark Pay callback log (last 40)</b><p class="mu" style="margin:6px 0 0">Callback URL: ${esc(location.origin)}/api/wm/callback</p></div>`+(w.map(x=>`<div class="card"><div class="row"><b>${esc(x.note)}</b><span class="pill" style="color:${x.ok?"#22c55e":"#ef4444"}">${x.ok?"ok":"fail"}</span></div><div class="mu" style="margin-top:6px;word-break:break-all">${esc(x.at)}<br>${esc(x.body)}</div></div>`).join("")||'<p class="mu">Waitmark callback ekhono ashe ni</p>');
async function sms(){const w=await api("admin/data/wmlog"),d=await api("admin/data/sms"),u=location.origin+"/api/sms/hook";
return `<div class="card"><b>📩 TrxID auto verify setup</b><p class="mu" style="line-height:1.8;margin:8px 0 0">1) Site Settings → Payment e <b>SMS secret</b> set korun.<br>2) bKash/Nagad/Rocket number-er phone e SMS Forwarder app boshiye ei link e POST korun:<br><b style="color:#e8edfb;word-break:break-all">${esc(u)}</b><br>3) Body (JSON): <b style="color:#e8edfb;word-break:break-all">{"secret":"APNAR_SECRET","from":"[from]","message":"[content]"}</b><br>Tarpor user TrxID dilei SMS-er sathe mille auto approve hobe.</p></div>`+
